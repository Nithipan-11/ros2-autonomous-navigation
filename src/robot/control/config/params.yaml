control_node:
  ros__parameters:
    lookahead_distance: 1.0     # m
    goal_tolerance: 0.3         # m
    linear_speed: 0.5           # m/s
    max_angular_speed: 1.0      # rad/s
    rotate_in_place_angle: 1.0  # rad
    base_offset: 1.3            # m from rear axle to lidar; pure pursuit tracks the axle
