planner_node:
  ros__parameters:
    goal_tolerance: 0.5        # m, final goal
    waypoint_tolerance: 1.0    # m, intermediate checkpoints (pass through without stopping)
    timeout_s: 300.0           # per checkpoint
    lethal_cost: 22            # cells >= this are impassable: cost = 100*(1 - d/2.2) -> d <= 1.7 m
    base_offset: 1.3           # m from rear axle (rotation centre) to lidar; plan for the axle
    cost_weight: 5.0           # higher = stays further from obstacles

    # Obstacle course (generated by tools/course/generate_course.py), flat [x1, y1, x2, y2, ...]
    course_waypoints: [11.5, -10.5, 11.5, 0.0, -12.0, 0.0, -12.0, 10.0, 12.0, 10.0]
    auto_start_course: true    # run the course on startup; publish std_msgs/Empty to /start_course to rerun
